<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Простой шаблон</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #222;
      background: #f5f6f8;
      line-height: 1.6;
    }

    header {
      background: #2c3e50;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header nav a {
      color: #ecf0f1;
      text-decoration: none;
      margin-left: 1rem;
    }

    header nav a:hover { text-decoration: underline; }

    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    footer {
      background: #2c3e50;
      color: #ecf0f1;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">МойСайт</div>
    <nav>
      <a href="#">Главная</a>
      <a href="#">О нас</a>
      <a href="#">Контакты</a>
    </nav>
  </header>

  <main>
    <h1>Заголовок страницы</h1>
    <p>Это пример текста. Замените его своим содержимым.</p>
  </main>

  <footer>
    &copy; 2026 МойСайт
  </footer>

</body>
</html>
